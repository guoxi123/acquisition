[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: 需要真实 PG 的集成测试（tests/integration/）
    unit: 纯单元测试，不依赖外部服务（tests/unit/）
testpaths = tests
