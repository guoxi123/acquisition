version = "0.1.0"
description = "亚马逊卖家获客 Agent 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",        # 应用层 async 驱动
    "psycopg2-binary>=2.9", # alembic 同步驱动
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "apify-client>=1.7",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "loguru>=0.7",
]
