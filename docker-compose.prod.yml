services:
  postgres:
    image: postgres:16-alpine
    container_name: acquisition-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acquisition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acquisition}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acquisition}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    container_name: acquisition-redis
    restart: always

  backend:
    build: ./backend
    container_name: acquisition-backend
    env_file: .env.prod
    environment:
      # Docker 内部网络：postgres/redis 是容器名
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acquisition}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acquisition}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-acquisition}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acquisition}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ""  # 同域（nginx 反代），不需要后端地址
    container_name: acquisition-frontend
    environment:
      NEXT_PUBLIC_API_BASE: ""
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: acquisition-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  pgdata:
