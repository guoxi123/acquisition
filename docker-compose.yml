services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acquisition-pg
    environment:
      POSTGRES_USER: acquisition
      POSTGRES_PASSWORD: acquisition_dev
      POSTGRES_DB: acquisition
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquisition"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acquisition-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
