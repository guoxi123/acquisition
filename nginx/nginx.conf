server {
    listen 80;
    client_max_body_size 10m;

    # 前端（Next.js）
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 后端 API（含 SSE 流式）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;          # SSE 必须关闭缓冲
        proxy_read_timeout 300s;      # SSE 长连接超时
        proxy_cache off;
    }

    # API 文档 / 健康检查
    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }
    location /health { proxy_pass http://backend:8000; }
    location /redoc { proxy_pass http://backend:8000; }

    # 技术文档站（VitePress 静态产物，compose volume 挂载）
    location /wiki/ {
        alias /usr/share/nginx/html/wiki/;
        try_files $uri $uri/ $uri.html =404;
    }
}
